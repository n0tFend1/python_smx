<script>
/* ===== CONTENIDO (cada lección: items html | ex | quiz) ===== */
const R=String.raw;
const L=[
{id:'fund',t:'0 · Fundamentos',items:[
{h:`<h2>Variables, tipos y entrada/salida</h2>
<p><b>Variable:</b> una caja con nombre donde guardas un valor. <code>edad = 17</code> significa «mete 17 en la caja llamada edad». El <code>=</code> NO es igualdad matemática: es «guarda lo de la derecha en lo de la izquierda». Puedes cambiar el contenido cuando quieras: <code>edad = edad + 1</code> (toma lo que hay, suma 1 y vuelve a guardar).</p>
<table border="1" cellpadding="5" style="border-collapse:collapse"><tr><th>tipo</th><th>qué es</th><th>ejemplo</th></tr><tr><td>int</td><td>entero</td><td>7</td></tr><tr><td>float</td><td>decimal (con punto)</td><td>3.5</td></tr><tr><td>str</td><td>texto, entre comillas</td><td>"Ana"</td></tr><tr><td>bool</td><td>verdadero/falso</td><td>True</td></tr></table>
<p><code>type(x)</code> te dice el tipo. Importante: <code>"3"</code> (texto) y <code>3</code> (número) son cosas distintas; <code>"3"+"4"</code> da <code>"34"</code> (pega textos) y <code>3+4</code> da <code>7</code>.</p>
<h3>print(): mostrar</h3>
<p><code>print</code> recibe lo que quieres mostrar, lo escribe en pantalla y <b>no devuelve nada útil</b> (no guarda el valor: para guardar, usa una variable). Parámetros: <code>sep</code> (separador entre valores, por defecto un espacio) y <code>end</code> (qué poner al final, por defecto un salto de línea).</p>
<h3>input(): leer</h3>
<p><code>input("pregunta")</code> espera a que el usuario escriba y <b>siempre devuelve texto</b>. Si necesitas un número: <code>int(input(...))</code> o <code>float(input(...))</code>. Convertir texto no numérico (<code>int("abc")</code>) da <code>ValueError</code>.</p>
<h3>f-strings: texto con huecos</h3>
<pre><code>nombre = "Ana"; precio = 3.5
print(f"{nombre} paga {precio:.2f} €")   # Ana paga 3.50 €</code></pre>
<p>La <code>f</code> delante permite meter variables dentro de <code>{}</code>; <code>:.2f</code> fuerza 2 decimales.</p>
<h3>Operadores aritméticos</h3>
<p><code>+ - * /</code> (división normal, siempre da float), <code>//</code> división entera (17//5 = 3), <code>%</code> resto (17%5 = 2), <code>**</code> potencia. Se evalúa primero <code>**</code>, luego <code>* / // %</code>, luego <code>+ -</code>; los paréntesis mandan.</p>
<div class="tip"><b>Errores típicos:</b> olvidar convertir <code>input()</code> (<code>"5"+1</code> da TypeError); poner espacios o mayúsculas distintas en el nombre de una variable (<code>Edad</code> ≠ <code>edad</code>); empezar un nombre con número.</div>`},
{quiz:{id:'q_str',q:'¿Qué resultado da <code>"3" + "4"</code>?',o:['7','"34" (texto pegado)','Error','3 4'],a:1,e:'Con textos, + concatena (pega). Para sumar números hay que convertirlos con int().'}},
{ex:{id:'f1',t:'Área y perímetro',q:'Pide base y altura (decimales) e imprime el área y el perímetro de un rectángulo, uno por línea.',
start:R`base = float(input("Base: "))
altura = float(input("Altura: "))
# calcula e imprime area y perimetro
`,stdin:'4\n3',hints:['area = base * altura','perimetro = 2 * (base + altura)','print(f"Área: {area}") y otra línea para el perímetro.'],
sol:R`base = float(input("Base: "))
altura = float(input("Altura: "))
area = base * altura
perimetro = 2 * (base + altura)
print(f"Área: {area}")
print(f"Perímetro: {perimetro}")`,tests:[[['4','3'],['12','14']],[['2.5','2'],['5','9']]]}},
{ex:{id:'f2',t:'Ticket formateado',q:'Pide producto, precio unitario y unidades. Imprime <code>Pan: 4 x 1.50 € = 6.00 €</code> (con ese formato, 2 decimales).',
start:R`producto = input("Producto: ")
precio = float(input("Precio: "))
unidades = int(input("Unidades: "))
`,stdin:'Pan\n1.5\n4',hints:['total = precio * unidades','Dentro del f-string usa {precio:.2f} y {total:.2f}.','print(f"{producto}: {unidades} x {precio:.2f} € = {total:.2f} €")'],
sol:R`producto = input("Producto: ")
precio = float(input("Precio: "))
unidades = int(input("Unidades: "))
total = precio * unidades
print(f"{producto}: {unidades} x {precio:.2f} € = {total:.2f} €")`,tests:[[['Pan','1.5','4'],['pan: 4 x 1.50 € = 6.00 €']],[['Té','2','3'],['té: 3 x 2.00 € = 6.00 €']]]}},
{ex:{id:'f3',t:'Minutos a horas',q:'Pide minutos totales e imprime en formato <code>2 h 15 min</code> usando <code>//</code> y <code>%</code>.',
start:R`total = int(input("Minutos: "))
`,stdin:'135',hints:['Horas completas: total // 60.','Minutos sobrantes: total % 60.','print(f"{horas} h {minutos} min")'],
sol:R`total = int(input("Minutos: "))
horas = total // 60
minutos = total % 60
print(f"{horas} h {minutos} min")`,tests:[[['135'],['2 h 15 min']],[['60'],['1 h 0 min']],[['45'],['0 h 45 min']]]}}]},
{id:'cond',t:'1 · Condicionales',items:[
{h:`<h2>Condicionales: que el programa decida</h2>
<p>Un programa normal ejecuta las líneas de arriba abajo. Un <b>condicional</b> es una bifurcación: «<i>si</i> pasa X, haz esto; <i>si no</i>, haz esto otro». Como un semáforo: si está verde, cruzas; si no, esperas.</p>
<pre><code>if edad &gt;= 18:      # condición: da True o False
    print("Mayor")   # solo si es True (¡indentado!)
elif edad &gt;= 0:      # solo se mira si la anterior fue False
    print("Menor")
else:                # ninguna se cumplió
    print("Edad imposible")</code></pre>
<p><b>Línea a línea:</b> Python evalúa la primera condición; si da <code>True</code> ejecuta su bloque y se salta el resto. Si no, prueba <code>elif</code>, y al final <code>else</code>. La <b>indentación</b> (4 espacios) marca qué líneas pertenecen al bloque.</p>
<div class="tip"><b>Errores típicos:</b> usar <code>=</code> (asignar) en vez de <code>==</code> (comparar); olvidar los <code>:</code>; olvidar convertir <code>input()</code> con <code>int()</code> (devuelve texto: <code>"5" == 5</code> es <code>False</code>).</div>
<p><b>Truco útil:</b> <code>m in (1,3,5)</code> pregunta «¿está m entre estos valores?» y evita escribir <code>m==1 or m==3 or m==5</code>. Para los bisiestos: un año lo es si es divisible por 4 y no por 100, salvo que lo sea por 400 (<code>%</code> da el resto de una división).</div>`},
{trace:{t:'Cómo decide Python (edad = 16)',code:['edad = 16','if edad >= 18:','    print("Mayor")','elif edad >= 0:','    print("Menor")','else:','    print("Imposible")'],s:[
{l:0,v:{edad:16},n:'Se crea la variable <b>edad</b> y se guarda 16.'},
{l:1,v:{edad:16},n:'Python pregunta: ¿16 &gt;= 18? Respuesta: <b>False</b>. Se salta el bloque indentado.'},
{l:3,v:{edad:16},n:'Prueba el <code>elif</code>: ¿16 &gt;= 0? Respuesta: <b>True</b>. Entra aquí.'},
{l:4,v:{edad:16},o:'Menor',n:'Ejecuta el print. Al acabar el bloque, <b>el resto (else) se ignora</b>: solo se elige un camino.'}]}},
{ex:{id:'e13',t:'Ejercicio 13 · Fecha correcta',
q:'Pide día, mes y año (tres <code>input</code>, en ese orden) e imprime <code>Fecha correcta</code> o <code>Fecha incorrecta</code> según los días que tiene cada mes (incluye años bisiestos).',
start:R`dia = int(input("Día: "))
mes = int(input("Mes: "))
anio = int(input("Año: "))
# 1) ¿cuántos días tiene ese mes? (febrero: ¿bisiesto?)
# 2) ¿está dia entre 1 y ese número?
`,stdin:'29\n2\n2024',
hints:['Primero calcula una variable con los días del mes; después compara el día con ella.','Meses de 31: 1,3,5,7,8,10,12. De 30: 4,6,9,11. Febrero: 29 si es bisiesto, si no 28. Un mes fuera de 1–12 es incorrecto.','Pseudocódigo: bisiesto = (a%4==0 and a%100!=0) or a%400==0; dm = según el mes; si 1 <= dia <= dm → correcta.'],
sol:R`dia = int(input("Día: "))
mes = int(input("Mes: "))
anio = int(input("Año: "))
bisiesto = (anio % 4 == 0 and anio % 100 != 0) or anio % 400 == 0
if mes in (1, 3, 5, 7, 8, 10, 12):
    dm = 31
elif mes in (4, 6, 9, 11):
    dm = 30
elif mes == 2:
    dm = 29 if bisiesto else 28
else:
    dm = 0          # mes inexistente: ningún día es válido
if 1 <= dia <= dm:
    print("Fecha correcta")
else:
    print("Fecha incorrecta")`,
tests:[[['29','2','2024'],['fecha correcta'],['incorrecta']],[['29','2','2023'],['fecha incorrecta']],[['31','4','2024'],['fecha incorrecta']],[['31','12','2024'],['fecha correcta'],['incorrecta']],[['5','13','2020'],['fecha incorrecta']]]}},
{ex:{id:'e17',t:'Ejercicio 17 · El dado',
q:'Pide el resultado de un dado (entero) y muestra <b>en letras</b> el número de la cara opuesta (1-6, 2-5, 3-4). Si no está entre 1 y 6 imprime <code>ERROR: número incorrecto.</code>',
start:R`n = int(input("Resultado del dado: "))
# Pista de razonamiento: las caras opuestas siempre suman 7
`,stdin:'1',
hints:['Fíjate: opuesta = 7 - n. Solo falta pasar el número a letra.','Primero comprueba el error (n < 1 or n > 6); si no, calcula la opuesta.','Un diccionario {1:"uno",...} o una cadena if/elif te dan la palabra.'],
sol:R`n = int(input("Resultado del dado: "))
if n < 1 or n > 6:
    print("ERROR: número incorrecto.")
else:
    letras = {1: "uno", 2: "dos", 3: "tres", 4: "cuatro", 5: "cinco", 6: "seis"}
    print(letras[7 - n])`,
tests:[[['1'],['seis']],[['2'],['cinco']],[['3'],['cuatro']],[['4'],['tres']],[['7'],['error: número incorrecto.']],[['0'],['error: número incorrecto.']]]}}]},

{id:'bucles',t:'2 · Bucles y menús',items:[
{h:`<h2>Bucles: repetir sin copiar y pegar</h2>
<p>Si tuvieras que pedir 10 números escribirías 10 veces lo mismo. Un bucle dice «repite esto». Python tiene dos:</p>
<pre><code>for i in range(1, 4):   # i vale 1, luego 2, luego 3 (el 4 NO entra)
    print(i)
while condicion:        # repite MIENTRAS sea True
    ...</code></pre>
<table border="1" cellpadding="5" style="border-collapse:collapse"><tr><th>vuelta</th><th>i</th><th>sale</th></tr><tr><td>1</td><td>1</td><td>1</td></tr><tr><td>2</td><td>2</td><td>2</td></tr><tr><td>3</td><td>3</td><td>3</td></tr></table>
<p><code>for</code> se usa cuando sabes cuántas vueltas (10 intentos, <i>n</i> empleados). <code>while</code> cuando no (hasta que el usuario elija «Salir»). <code>break</code> sale del bucle; <code>for … else</code> ejecuta el <code>else</code> solo si el bucle terminó <b>sin</b> <code>break</code> (ideal para «se acabaron los intentos»).</p>
<div class="tip"><b>Patrones:</b> <i>contador</i> (<code>n += 1</code>), <i>acumulador</i> (<code>total += x</code>, empieza en 0). <b>Error típico:</b> <code>while True</code> sin ningún <code>break</code> = bucle infinito (aquí se corta a los 8 s).</div>`},
{trace:{t:'Un for paso a paso: sumar 1+2+3',code:['total = 0','for i in range(1, 4):','    total += i','print(total)'],s:[
{l:0,v:{total:0},n:'El acumulador empieza en 0.'},
{l:1,v:{total:0,i:1},n:'Vuelta 1: <code>i</code> toma el primer valor del rango: <b>1</b>.'},
{l:2,v:{total:1,i:1},n:'<code>total += i</code> significa total = total + i → 0 + 1 = <b>1</b>.'},
{l:1,v:{total:1,i:2},n:'Vuelta 2: i vale <b>2</b>.'},
{l:2,v:{total:3,i:2},n:'1 + 2 = <b>3</b>.'},
{l:1,v:{total:3,i:3},n:'Vuelta 3: i vale <b>3</b>. (El 4 no entra: range se para antes.)'},
{l:2,v:{total:6,i:3},n:'3 + 3 = <b>6</b>.'},
{l:3,v:{total:6,i:3},o:'6',n:'No quedan valores: el bucle termina y se ejecuta el print. Sale <b>6</b>.'}]}},
{quiz:{id:'q_range',q:'¿Qué imprime <code>for i in range(3): print(i)</code>?',o:['1 2 3','0 1 2','0 1 2 3','3 2 1'],a:1,e:'range(3) genera 0, 1, 2: empieza en 0 y se detiene ANTES de 3.'}},
{ex:{id:'e2',t:'Ejercicio 2 · Adivina el número',mock:1,
q:'Genera un número aleatorio 1-100 (<code>random.randint</code>). El usuario tiene 10 intentos. Di «<b>mayor</b>» o «<b>menor</b>» y los intentos que quedan. Si acierta: <code>Acertaste en N intentos</code>. Si agota: muestra el número. <span class="mu">(Para corregir, el número se fija en 42.)</span>',
start:R`import random
numero = random.randint(1, 100)
# Usa un for con 10 vueltas (o un while con contador)
`,stdin:'50\n30\n42',

sol:R`import random

start:R`n = int(input("Empleados: "))

`,stdin:'2\n10\n2\n4\n6\n1\n8',

{id:'tablas',t:'3 · Listas y tablas',items:[
{h:`<h2>Listas: una tabla es una lista de listas</h2>
<p>Una <b>lista</b> es una fila de cajas numeradas desde 0: <code>fila = ["12345A","Ana","ana@mail.es"]</code>; <code>fila[1]</code> es <code>"Ana"</code>. Una <b>tabla</b> es una lista cuyas casillas son otras listas: <code>tabla[2][0]</code> = fila 2, columna 0.</p>
<p>Dos maneras de construirla (las que pide el ejercicio):</p>
<pre><code># 1) Tabla creada vacía y rellenada por coordenadas
tabla = [["","",""] for _ in range(3)]
tabla[0][1] = "Ana"
# 2) Tabla que crece con append
tabla = []
tabla.append(["12345A","Ana","ana@mail.es"])</code></pre>
<div class="tip"><b>Error típico:</b> <code>[["","",""]]*3</code> repite la MISMA fila 3 veces (alias): cambiar una cambia todas. Por eso usamos una comprensión.</div>`},
{ex:{id:'gb1',t:'Libro de visitas · Método 1 (tabla prefijada)',

{id:'func',t:'4 · Funciones',items:[
{h:`<h2>Funciones: recetas reutilizables</h2>
<p>Una <b>función</b> es un bloque con nombre que haces una vez y usas muchas. Sin funciones copiarías el mismo código en cada sitio, y si hay un fallo tendrías que arreglarlo en todas partes.</p>
<pre><code>def area_circulo(radio):        # def = definir; radio = parámetro (hueco)
    return 3.14159 * radio ** 2  # return = el resultado que DEVUELVE

a = area_circulo(2)              # llamada: 2 = argumento (valor real)
print(a)                         # 12.56636</code></pre>
<p><b>Paso a paso:</b> al hacer <code>def</code> Python solo memoriza la receta; no ejecuta nada. En la llamada, <code>radio</code> toma el valor 2, se calcula, y <code>return</code> devuelve el resultado al sitio de la llamada y termina la función.</p>
<p><b>return vs print:</b> <code>print</code> solo muestra en pantalla; <code>return</code> entrega un valor que puedes guardar o seguir usando. Una función sin <code>return</code> devuelve <code>None</code>.</p>
<p><b>Valores por defecto:</b> <code>def saludar(nombre, saludo="Hola")</code>: si no pasas el saludo, vale «Hola». Los parámetros con valor por defecto van al final. También puedes llamar por nombre: <code>saludar("Ana", saludo="Buenas")</code>.</p>
<p><b>Ámbito:</b> las variables creadas dentro de una función son <i>locales</i>: solo existen ahí dentro (como las notas que escribes en un borrador que se tira al acabar).</p>
<div class="tip"><b>Errores típicos:</b> definir la función y no llamarla; usar <code>print</code> cuando querías <code>return</code>; olvidar los <code>:</code>; llamar con distinto número de argumentos que parámetros (TypeError).</div>`},

{id:'exc',t:'5 · Excepciones',items:[
{h:`<h2>Excepciones: cuando algo falla, sin que el programa explote</h2>
<p>Si el usuario escribe «abc» donde esperabas un número, <code>int()</code> lanza un error (<code>ValueError</code>) y el programa se detiene. Con <code>try/except</code> dices: «intenta esto; si falla de esta forma, haz esto otro». Es como un cinturón de seguridad.</p>
<pre><code>try:
    n = int(input("Número: "))     # intentar
except ValueError:                  # solo este tipo de fallo
    print("Entrada no válida")
else:
    print("Todo bien")              # solo si NO hubo error
finally:
    print("Fin")                    # SIEMPRE</code></pre>
<p>Si dentro del <code>try</code> hay error, Python salta directamente al <code>except</code> sin acabar el bloque. Errores frecuentes: <code>ValueError</code> (conversión), <code>ZeroDivisionError</code>, <code>FileNotFoundError</code>, <code>IndexError</code>, <code>KeyError</code>.</p>
<div class="tip"><b>Buena práctica:</b> captura el error concreto (<code>except ValueError</code>), no «todo» con <code>except:</code>, o ocultarás fallos reales. Para pedir un dato hasta que sea válido: <code>while True</code> con <code>try</code> y <code>break</code> cuando funcione.</div>`},
{quiz:{id:'q_fin',q:'¿Cuándo se ejecuta el bloque <code>finally</code>?',o:['Solo si hay error','Solo si no hay error','Siempre','Nunca'],a:2,e:'finally se ejecuta pase lo que pase; sirve para cerrar o limpiar.'}},

{h:`<h2>Aprende a leer los errores</h2>
<p>Los errores no son un castigo: son <b>pistas</b>. Python te dice QUÉ pasó y DÓNDE. Cuando falle un programa, mira la <b>última línea</b> (el tipo de error: <code>SyntaxError</code>, <code>TypeError</code>, <code>NameError</code>…) y la <b>línea indicada</b> arriba. Pulsa <b>▶ Ejecutar</b> en cada caso para ver el error REAL, descubre la causa y arréglalo hasta que pase <b>Comprobar</b>. El último caso no da ningún error, y esos son los peores.</p>`},

{id:'ficheros',t:'7 · Ficheros',items:[
{h:`<h2>Ficheros: que los datos sobrevivan al programa</h2>
<p>Las variables desaparecen cuando el programa acaba; un fichero es como un cuaderno donde apuntas para el futuro. Tres pasos: <b>abrir → usar → cerrar</b>. Con <code>with</code> el cierre es automático (como una puerta que se cierra sola al salir):</p>
<pre><code>with open("datos.txt", "w") as f:   # f = el fichero abierto
    f.write("Hola\n")               # \n = salto de línea (hay que ponerlo tú)
with open("datos.txt", "r") as f:
    for linea in f:                  # una línea cada vuelta
        print(linea, end="")         # end="" evita doble salto</code></pre>
<table border="1" cellpadding="5" style="border-collapse:collapse"><tr><th>modo</th><th>significado</th></tr><tr><td>r</td><td>leer (por defecto)</td></tr><tr><td>w</td><td>escribir, <b>borra</b> lo anterior</td></tr><tr><td>a</td><td>añadir al final</td></tr><tr><td>x</td><td>crear; error si ya existe</td></tr></table>
<p>Lectura: <code>read()</code> todo junto, <code>readline()</code> una línea (devuelve <code>''</code> al llegar al final), <code>readlines()</code> lista de líneas. <code>writelines(lista)</code> NO añade saltos de línea: salen pegados.</p>
<p class="mu">Aquí el «disco» es un sistema de ficheros virtual del navegador: los ficheros existen mientras no recargues la página.</p>`},

{id:'mods',t:'8 · Módulos externos',items:[
{h:`<h2>Practiquemos los módulos de Python</h2>
<p>Un <b>módulo</b> es código que otra persona ya escribió. Se instala una vez con <code>pip</code> (en tu terminal) y se usa con <code>import</code>. Es como pedir una herramienta prestada en vez de fabricarla.</p>
<div class="tip">Estos módulos (audio, vídeo, cámara, IA) necesitan tu ordenador real, por eso <b>no se pueden ejecutar en esta página</b>: aquí tienes el código para copiar y ejecutar en local, más preguntas de comprensión.</div>
<h3>1. Audio con playsound</h3><pre><code># pip install playsound
from playsound import playsound
nombre = input("Fitxer d'àudio: ")
playsound(nombre)   # reproduce y espera a que acabe</code></pre>
<h3>2. Reproductor con pygame (reto: menú 1 Reproducir, 2 Pausar, 3 Continuar, 4 Parar, 5 Salir)</h3><pre><code># pip install pygame
import pygame
pygame.mixer.init()
pygame.mixer.music.load("musica.mp3")
pygame.mixer.music.play()
input("Prem ENTER per acabar...")
pygame.mixer.music.stop()
# pausa: music.pause()  ·  continuar: music.unpause()</code></pre>
<h3>3. Vídeo con OpenCV (reto: q cierra, p pausa, r reanuda)</h3><pre><code># pip install opencv-python
import cv2
video = cv2.VideoCapture("video.mp4")
while True:
    correcto, imagen = video.read()   # lee un fotograma
    if not correcto:                  # fin del vídeo
        break
    cv2.imshow("Vídeo", imagen)
    if cv2.waitKey(25) &amp; 0xFF == ord("q"):
        break
video.release(); cv2.destroyAllWindows()</code></pre>
<h3>4-6. Detectar objetos con YOLO (ejercicio final)</h3><pre><code># pip install ultralytics
from ultralytics import YOLO
modelo = YOLO("yolo11n.pt")
foto = input("Fotografia: ")
nombres = []
for resultado in modelo(foto):
    for caja in resultado.boxes:
        nombres.append(resultado.names[int(caja.cls[0])])
print("Objectes detectats:")
for n in nombres: print("-", n)
print(f"S'han detectat {len(nombres)} objectes.")</code></pre>
<p class="mu">Es una propuesta basada en tu enunciado; no la he podido ejecutar aquí (necesita modelo y fotografía). Idea para el reto: guarda los nombres en una lista y usa <code>len()</code> para contarlos.</p>`},

function onMsg(e){const d=e.data;if(d.t=='ready'){rdy=true;$('#st').textContent='Python: listo ✔'}

function mainThread(){FB=true;let py=null;$('#st').textContent='Python: cargando (sin Worker, necesita Internet)…';
 const s=document.createElement('script');s.src=CDN;
 s.onload=()=>loadPyodide().then(p=>{py=p;onMsg({data:{t:'ready'}})}).catch(()=>onMsg({data:{t:'fail'}}));
 s.onerror=()=>onMsg({data:{t:'fail'}});document.head.appendChild(s);

 pend={id,res,to};W.postMessage({id,code,inputs,mock:!!mock})})}

function symCard(s,i){return `<div class=card id=s-${i}><div class=sy><span class=sb>${esc(s[0])}</span><div><b>${s[1]}</b><div class=mu>Se lee: ${s[2]}</div></div></div><p>${s[3]}</p><p>💡 <i>${s[4]}</i></p><textarea rows=${s[5].split('\n').length+1} spellcheck=false aria-label="Ejemplo editable">${esc(s[5])}</textarea><div class=row><button class=p data-run=1>▶ Ejecutar (y cámbialo si quieres)</button></div><pre class=out></pre><p class=mu>⚠️ ${s[6]}</p></div>`}
const SP=()=>[['sym','🔣 Símbolos raros'],['map','🗺️ Mapa'],['dic','📖 Diccionario'],['lab','🧪 Laboratorio libre']].map(([i,t])=>`<a tabindex=0 data-id=${i} class="${i==cur?'on':''}">${t}</a>`).join('');
function linkify(){const used=new Set(),w=document.createTreeWalker($('#m'),NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const p=n.parentElement;if(p.closest('pre,textarea,button,summary,h2,h3,a,.hero,.cl,.tn,.vs,.to,.out'))return;
  if(p.tagName=='CODE'){const tx=n.nodeValue.trim(),si=SYM.findIndex(s=>s[0]==tx);if(si>=0){if(!used.has('s'+si)){used.add('s'+si);const a=document.createElement('a');a.className='gl';a.tabIndex=0;a.dataset.s=si;a.textContent=n.nodeValue;n.replaceWith(a)}return}if(!/^\w+(\(\))?$/.test(tx))return}
  let node=n;for(const g of G){if(used.has(g[0]))continue;const m=node.nodeValue.match(new RegExp(`(?<![\\p{L}\\w])(${g[2]})(?![\\p{L}\\w])`,'iu'));if(!m)continue;
   used.add(g[0]);const r=node.splitText(m.index),after=r.splitText(m[0].length),a=document.createElement('a');a.className='gl';a.tabIndex=0;a.dataset.k=g[0];a.textContent=r.nodeValue;r.replaceWith(a);node=after}})}
function gcard(g){return `<div class=card><b>${g[1]}</b><p>💡 <i>${g[3]}</i></p><p>${g[4]}</p><pre><code>${esc(g[5])}</code></pre><div class=row><button class=p data-lab="${g[0]}">🧪 Probar</button><button data-go=${g[6]}>📚 Lección</button></div></div>`}
function openG(k){const g=G.find(x=>x[0]==k);if(!g)return;if(!S.seen[k]){S.seen[k]=1;S.xp+=2;toast('📖 +2 XP · descubriste «'+g[1]+'»');if(Object.keys(S.seen).length>=5)unlock('curioso');save();hud()}
 const md=$('#md');md.hidden=false;md.innerHTML=`<div class=box role=dialog aria-modal=true><button data-x style="float:right">✕</button>${gcard(g)}</div>`;md.querySelector('[data-x]').focus()}
function special(){const m=$('#m');let h='';
 if(cur=='map'){const nx=L.find(l=>!units(l).every(k=>S.done[k]));
  h=`<div class=hero><span class=ic>🗺️</span><h2>Tu mapa de aventura</h2><p>${greet()}</p><span class=pill>Las palabras subrayadas son enlaces: tócalas y te lo explican.</span></div>`+(nx?`<div class=card><b>🎯 Misión recomendada:</b> ${nx.t}<br><button class=p data-go=${nx.id}>Continuar ▶</button></div>`:'<div class=win>🏆 ¡Has completado todo el mapa!</div>')+`<div class=path>${L.map((l,i)=>{const u=units(l),d=u.filter(k=>S.done[k]).length;return `<div class="isl ${d==u.length?'done':l==nx?'now':''}" style="margin-left:${i%2?'34%':'2%'}" data-go=${l.id} tabindex=0><span>${IC[l.id]}</span><div><b>${l.t.replace(/^\\d+ · /,'')}</b><br><small>${TL[l.id][0]} · ${d}/${u.length}</small></div></div>`}).join('')}</div>`}
 else if(cur=='dic')h=`<div class=hero><span class=ic>📖</span><h2>Diccionario</h2><p>Todas las ideas del curso, con una analogía y un ejemplo para probar.</p></div><input id=q placeholder="Buscar… (ej: bucle)" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--tx)"><div id=gl></div>`;
 else if(cur=='sym')h=`<div class=hero><span class=ic>🔣</span><h2>Símbolos raros</h2><p>Todo lo que parece un jeroglífico al empezar: != // % ** : _ y más. Cada uno con su traducción, una analogía y un ejemplo que puedes cambiar y ejecutar.</p></div><input id=q placeholder="Buscar símbolo… (ej: !=)" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--tx)"><div id=sl></div><h3>🎯 ¿Lo has descifrado?</h3><div id=sqs></div>`;
 else h=`<div class=hero><span class=ic>🧪</span><h2>Laboratorio libre</h2><p>Escribe lo que quieras y ejecútalo. Sin notas, sin presión: experimenta.</p></div><div id=lb></div>`;
 m.innerHTML=h;
 if(cur=='dic'){const f=()=>{const t=$('#q').value.toLowerCase();$('#gl').innerHTML=G.filter(g=>(g[1]+g[3]+g[4]).toLowerCase().includes(t)).map(gcard).join('')||'<p class=mu>Sin resultados.</p>'};$('#q').oninput=f;f()}
 if(cur=='sym'){const f=()=>{const t=$('#q').value.toLowerCase();$('#sl').innerHTML=SYM.map((s,i)=>[s,i]).filter(([s])=>(s[0]+s[1]+s[2]+s[3]).toLowerCase().includes(t)).map(([s,i])=>symCard(s,i)).join('')||'<p class=mu>Sin resultados.</p>'};$('#q').oninput=f;f();SQ.forEach(q=>{const d=document.createElement('div');$('#sqs').appendChild(d);quiz(d,q)})}
 if(cur=='lab'){const d=document.createElement('div');$('#lb').appendChild(d);ex(d,{lab:1,id:'lab',t:'Tu código',q:'Ctrl+Enter ejecuta. Si usas input(), escribe los datos en el cuadro de entradas.',start:S.labcode||'print("¡Hola, mundo!")',stdin:'',hints:[],sol:'',tests:[]})}
 menu();scrollTo(0,0);if(cur!='dic')linkify()}
document.addEventListener('click',e=>{const t=e.target,gl=t.closest('.gl'),rn=t.closest('[data-run]');if(rn){const c=rn.closest('.card'),o=c.querySelector('.out');o.textContent='Ejecutando…';return runPy(c.querySelector('textarea').value,[],0).then(r=>{o.innerHTML=esc(r.out)+(r.err?`<span class=ko>\n${esc(r.err)}</span>`:'')})}if(gl){if(gl.dataset.s!==undefined){cur='sym';show();const el=$('#s-'+gl.dataset.s);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid var(--ac)'}return}return openG(gl.dataset.k)}const lb=t.closest('[data-lab]');if(lb){S.labcode=G.find(x=>x[0]==lb.dataset.lab)[5];$('#md').hidden=true;cur='lab';return show()}
 const go=t.closest('[data-go]');if(go){$('#md').hidden=true;cur=go.dataset.go;return show()}if(t.id=='md'||t.closest('[data-x]'))$('#md').hidden=true});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#md').hidden=true;if(e.key=='Enter'&&e.target.matches('.gl,.isl'))e.target.click()});
const IC={det:'🕵️',fund:'📦',cond:'🔀',bucles:'🔁',tablas:'🗂️',func:'🧩',exc:'🛟',ficheros:'📁',mods:'🧰'};
const TL={det:['Lees los errores reales de Python y los arreglas.','15 min'],fund:['Guardas datos en variables, pides y muestras información.','10 min'],cond:['El programa decide qué camino seguir según una condición.','12 min'],bucles:['Repites acciones sin copiar y pegar código.','20 min'],tablas:['Organizas datos en filas y columnas con listas.','12 min'],func:['Empaquetas código en recetas reutilizables.','15 min'],exc:['Controlas los fallos para que el programa no explote.','12 min'],ficheros:['Guardas y recuperas datos en el disco.','15 min'],mods:['Usas herramientas hechas por otros con pip e import.','10 min']};
function sections(html){const t=document.createElement('div');t.innerHTML=html;const out=document.createElement('div');let c=out;
 [...t.childNodes].forEach(n=>{if(n.nodeName=='H3'){const dt=document.createElement('details');dt.className='sec';const s=document.createElement('summary');s.textContent=n.textContent;dt.appendChild(s);out.appendChild(dt);c=dt}else c.appendChild(n.cloneNode(true))});
 const ds=out.querySelectorAll('details');if(ds.length)ds[0].open=true;
 if(ds.length>1){const b=document.createElement('button');b.textContent='⇅ Abrir / cerrar todo';b.onclick=()=>{const o=![...ds].every(x=>x.open);ds.forEach(x=>x.open=o)};out.insertBefore(b,out.children[1]||null)}
 return out}
function trace(d,t){d.className='card';let i=0;
 d.innerHTML=`<b>🎬 ${t.t}</b> <span class=mu>(animación explicativa preparada; no es una ejecución real)</span><div class=tg><div class=cl>${t.code.map((c,k)=>`<div data-k=${k}><i>${k+1}</i>${esc(c)}</div>`).join('')}</div><div><div class=mu>Variables en memoria</div><div class=vs></div><div class=mu>Pantalla</div><pre class=to></pre></div></div><p class=tn></p><div class=row><button data-d=-1>◀ Atrás</button><button class=p data-d=1>Paso siguiente ▶</button><button data-d=0>↺ Reiniciar</button><span class=mu></span></div>`;
 const paint=()=>{const s=t.s[i];d.querySelectorAll('.cl div').forEach(e=>e.classList.toggle('cur',+e.dataset.k==s.l));
  d.querySelector('.vs').innerHTML=Object.entries(s.v).map(([k,v])=>`<span class=chip>${k} = <b>${esc(String(v))}</b></span>`).join('')||'<span class=mu>—</span>';
  d.querySelector('.to').textContent=t.s.slice(0,i+1).map(x=>x.o).filter(Boolean).join('\n');
  d.querySelector('.tn').innerHTML=s.n;d.querySelector('.row .mu').textContent=`Paso ${i+1} de ${t.s.length}`};
 d.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{const k=+b.dataset.d;i=k==0?0:Math.max(0,Math.min(t.s.length-1,i+k));paint()});paint()}
/* ===== UI ===== */
let cur='map';
function menu(){hud();let n=0,t=0;$('#menu').innerHTML=SP()+L.map(l=>{const u=units(l),d=u.filter(x=>S.done[x]).length;n+=d;t+=u.length;
 return `<a tabindex=0 data-id="${l.id}" class="${l.id==cur?'on':''}">${d==u.length?'✅':(IC[l.id]||'▫️')} ${l.t} <span class=mu>${d}/${u.length}</span></a>`}).join('');
 $('#pb').style.width=(100*n/t)+'%';const cl=L.find(x=>x.id==cur),bn=$('#bn');if(bn&&cl)bn.innerHTML=units(cl).every(x=>S.done[x])?'<div class=win>🎉 ¡Lección completada! Pasa a la siguiente o repasa las pistas y soluciones.</div>':'';$('#pt').textContent=`Progreso: ${n} de ${t} actividades`;
 document.querySelectorAll('#menu a').forEach(a=>{a.onclick=a.onkeydown=e=>{if(e.type=='click'||e.key=='Enter'){cur=a.dataset.id;show()}}})}
function show(){if(['map','dic','lab','sym'].includes(cur))return special();const l=L.find(x=>x.id==cur);const m=$('#m');m.innerHTML=`<div class=hero><span class=ic>${IC[l.id]}</span><h2>${l.t.replace(/^\d+ · /,'')}</h2><p>${greet()}</p><p><b>Al terminar:</b> ${TL[l.id][0]}</p><span class=pill>⏱ ${TL[l.id][1]} · ${units(l).length} actividades</span></div><div id=bn></div>`;
 l.items.forEach(it=>{const d=document.createElement('div');
  if(it.h){d.appendChild(sections(it.h))}else if(it.trace)trace(d,it.trace);else if(it.quiz)quiz(d,it.quiz);else ex(d,it.ex);m.appendChild(d)});
 const i=L.indexOf(l);m.insertAdjacentHTML('beforeend',`<div class=row>${i?`<button id=pv>← Anterior</button>`:''}${i<L.length-1?`<button class=p id=nx>Siguiente →</button>`:''}</div>`);
 if($('#pv'))$('#pv').onclick=()=>{cur=L[i-1].id;show()};if($('#nx'))$('#nx').onclick=()=>{cur=L[i+1].id;show()};
 menu();scrollTo(0,0);linkify()}
function quiz(d,q){d.className='card';d.innerHTML=`<b>Pregunta rápida</b> ${S.done[q.id]?'<span class=badge>✔ resuelta</span>':''}<p>${q.q}</p>`+q.o.map((o,i)=>`<button class=opt data-i=${i}>${esc(o)}</button>`).join('')+'<p class=fb></p>';
 d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i==q.a;if(!ok){cb=0;snd(0);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}d.querySelector('.fb').innerHTML=ok?`<span class=ok>✔ Correcto.</span> ${q.e}`:`<span class=ko>✘ No exactamente.</span> Piénsalo otra vez.`;
  if(ok){award(q.id,10)}})}
function ex(d,x){d.className='card';let h=0;
 d.innerHTML=`<h3 style="margin-top:0">${x.t} ${S.done[x.id]?'<span class=badge>✔ resuelto</span>':''}</h3><p>${x.q}</p>
 <textarea class=code rows=11 spellcheck=false aria-label="Código"></textarea>
 <div class=mu>Entradas para <code>input()</code> (una por línea):</div><textarea class=in rows=3 spellcheck=false></textarea>
 <div class=row><button class=p data-a=run>▶ Ejecutar</button><button data-a=chk>✔ Comprobar</button><button data-a=rst>↺ Restablecer</button><button data-a=cp>⧉ Copiar</button><button data-a=hint>💡 Pista</button><button data-a=sol>Solución</button></div>
 <pre class=out></pre><div class=extra></div>`;
 const c=d.querySelector('.code'),i=d.querySelector('.in'),o=d.querySelector('.out'),ext=d.querySelector('.extra');c.value=x.start;i.value=x.stdin||'';
 c.onkeydown=e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();act.run();return}if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
 const ins=()=>i.value.trim()?i.value.split('\n'):[];
 const act={
  async run(){o.textContent='Ejecutando…';const r=await runPy(c.value,ins(),x.mock);o.innerHTML=esc(r.out)+(r.err?`<span class=ko>\n${esc(r.err)}</span>`:'')},
  async chk(){o.textContent='Probando…';let msg='';
   for(const [n,t] of x.tests.entries()){const r=await runPy(c.value,t[0],x.mock),low=r.out.toLowerCase();
    if(r.err){msg=`Prueba ${n+1} (entradas: ${t[0].join(', ')||'ninguna'}): error → ${r.err}`;break}
    const miss=t[1].find(s=>!low.includes(s)),bad=(t[2]||[]).find(s=>low.includes(s));
    if(miss!==undefined||bad!==undefined){msg=`Prueba ${n+1} (entradas: ${t[0].join(', ')||'ninguna'}): `+(miss!==undefined?`esperaba ver «${miss.trim()}» en la salida`:`no debería aparecer «${bad.trim()}»`)+`.\nTu salida:\n${r.out}`;break}}
   if(!msg&&x.code){const f=x.code.find(s=>!c.value.includes(s));if(f)msg=`Funciona, pero el enunciado pide usar «${f}».`}
   if(msg){o.innerHTML=`<span class=ko>✘ ${esc(msg)}</span>`;cb=0;snd(0);o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake')}else{o.innerHTML=`<span class=ok>✔ ¡Correcto! Pasa las ${x.tests.length} prueba(s).</span>`;award(x.id,30)}},
  rst(){c.value=x.start;o.textContent=''},
  cp(){navigator.clipboard&&navigator.clipboard.writeText(c.value)},
  hint(){h=Math.min(h+1,3);ext.innerHTML=`<div class=tip>${x.hints.slice(0,h).map((t,k)=>`<b>Pista ${k+1}:</b> ${t}`).join('<br>')}</div>`},
  sol(){ext.innerHTML=`<div class=tip><b>Una posible solución</b> (hay otras válidas):<pre><code>${esc(x.sol)}</code></pre><button data-a=use>Cargar en el editor</button></div>`;ext.querySelector('button').onclick=()=>{c.value=x.sol}}};
 if(x.lab)d.querySelectorAll('[data-a=chk],[data-a=hint],[data-a=sol]').forEach(b=>b.remove());d.querySelectorAll('button[data-a]').forEach(b=>{if(act[b.dataset.a])b.onclick=act[b.dataset.a]})}
function theme(){document.documentElement.dataset.t=S.theme}
$('#th').onclick=()=>{S.theme=S.theme=='d'?'l':'d';theme();save()};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S.done={};S.xp=0;S.badges={};S.streak=0;S.last=null;save();show()}};
theme();boot();show();
</script></body></html>
